name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infra/gcp/sql/**"
      - "infra/k8s/**"
      - "infra/scripts/wait-for-k8s-job.sh"
      - "scripts/ci-repair-agent.mjs"
      - "scripts/ci-repair-agent.test.mjs"
      - ".github/ci-repair-agent.json"
      - ".github/workflows/gke-deploy.yml"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infra/gcp/bootstrap/**"
      - "infra/gcp/terraform/**"
      - "infra/gcp/sql/**"
      - "infra/k8s/**"
      - "infra/scripts/**"
      - "scripts/**"
      - ".github/ci-repair-agent.json"
      - ".github/workflows/**"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy after validation; leave false for repair-branch validation"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production != true)) && format('robur-deployment-validation-{0}', github.ref) || 'robur-production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production != true) }}

jobs:
  validate:
    name: Validate applications and deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.5

      - name: Validate bootstrap Terraform
        working-directory: infra/gcp/bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Validate production Terraform
        working-directory: infra/gcp/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Check deployment shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find infra/scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Validate deployment placeholders and migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(find infra/gcp/sql -maxdepth 1 -type f -name 'V*.sql' | wc -l | tr -d ' ')" -ge 1
          test "$(grep -RIl 'PROJECT_ID' infra/k8s | wc -l | tr -d ' ')" -ge 1

  build:
    name: Build and push containers
    # GCP is paused. Resuming requires the repository opt-in and an explicit dispatch.
    if: vars.GCP_DEPLOYMENTS_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      REGISTRY: ${{ vars.GCP_REGION || 'europe-west2' }}-docker.pkg.dev
      REPOSITORY: robur-app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deployment configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$TERRAFORM_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push web image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/robur-web
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" -f apps/web/Dockerfile .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Build and push API image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/robur-api
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" -f apps/api/Dockerfile .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy to GKE
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      CLUSTER: ${{ vars.GKE_CLUSTER || 'robur-cluster' }}
      K8S_NAMESPACE: robur
      WEB_DOMAIN_NAME: ${{ vars.WEB_DOMAIN_NAME || 'robur.fit' }}
      REGISTRY: ${{ vars.GCP_REGION || 'europe-west2' }}-docker.pkg.dev
      REPOSITORY: robur-app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials "$CLUSTER" --region "$REGION" --project "$PROJECT_ID"

      - name: Apply namespace and runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f infra/k8s/namespace.yaml
          sed "s/PROJECT_ID/${PROJECT_ID}/g" infra/k8s/config/serviceaccounts.yaml | kubectl apply -f -
          sed "s/PROJECT_ID/${PROJECT_ID}/g" infra/k8s/config/healthkit-secret-provider.yaml | kubectl apply -f -
          kubectl -n "$K8S_NAMESPACE" apply -f infra/k8s/config/robur-config.yaml

      - name: Apply services, certificate, and ingress
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f infra/k8s/api-service.yaml
          kubectl apply -f infra/k8s/web-service.yaml
          sed "s/WEB_DOMAIN_NAME/${WEB_DOMAIN_NAME}/g" infra/k8s/managed-certificate.yaml | kubectl apply -f -
          sed "s/WEB_DOMAIN_NAME/${WEB_DOMAIN_NAME}/g" infra/k8s/ingress.yaml | kubectl apply -f -

      - name: Create immutable migration input
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" create configmap "robur-sql-migrations-${GITHUB_RUN_ID}" \
            --from-file=infra/gcp/sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          job="robur-flyway-${GITHUB_RUN_ID}"
          migrations="robur-sql-migrations-${GITHUB_RUN_ID}"
          sed \
            -e "s/name: robur-flyway/name: ${job}/" \
            -e "s/name: robur-sql-migrations/name: ${migrations}/" \
            infra/k8s/migrations/flyway-job.yaml | kubectl -n "$K8S_NAMESPACE" apply -f -
          if ! ./infra/scripts/wait-for-k8s-job.sh "$K8S_NAMESPACE" "$job"; then
            kubectl -n "$K8S_NAMESPACE" describe "job/$job" || true
            kubectl -n "$K8S_NAMESPACE" logs "job/$job" --all-containers --tail=200 || true
            exit 1
          fi
          kubectl -n "$K8S_NAMESPACE" delete "configmap/$migrations" --ignore-not-found

      - name: Apply workloads with immutable image tags
        shell: bash
        run: |
          set -euo pipefail
          for file in infra/k8s/api-deployment.yaml infra/k8s/web-deployment.yaml; do
            sed \
              -e "s/PROJECT_ID/${PROJECT_ID}/g" \
              -e "s/:latest/:${GITHUB_SHA}/g" \
              "$file" | kubectl apply -f -
          done

      - name: Verify rollouts
        shell: bash
        run: |
          set -euo pipefail
          for deployment in robur-api robur-web; do
            if ! kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$deployment" --timeout=600s; then
              kubectl -n "$K8S_NAMESPACE" describe "deployment/$deployment" || true
              kubectl -n "$K8S_NAMESPACE" get pods -o wide || true
              kubectl -n "$K8S_NAMESPACE" logs "deployment/$deployment" --all-containers --tail=200 || true
              exit 1
            fi
          done

      - name: Publish ingress and DNS handoff
        shell: bash
        run: |
          set -euo pipefail
          ingress_ip=""
          for _ in $(seq 1 30); do
            ingress_ip="$(kubectl -n "$K8S_NAMESPACE" get ingress robur -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            [[ -n "$ingress_ip" ]] && break
            sleep 10
          done
          if [[ -z "$ingress_ip" ]]; then
            echo "::warning::Ingress IP is not allocated yet. Recheck: kubectl -n $K8S_NAMESPACE get ingress robur"
            kubectl -n "$K8S_NAMESPACE" describe ingress robur || true
            kubectl -n "$K8S_NAMESPACE" get managedcertificate robur-web-cert -o wide || true
            exit 0
          fi
          {
            echo "### Robur production ingress"
            echo
            echo "Create or update the DNS A record: \`$WEB_DOMAIN_NAME -> $ingress_ip\`"
            echo
            echo "Google-managed TLS becomes active after DNS resolves to this address."
          } >> "$GITHUB_STEP_SUMMARY"

  notify-repair:
    name: Queue trusted CI repair diagnosis
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.validate.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure')
    needs:
      - validate
      - build
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch repair observer
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=ci-repair \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}"
