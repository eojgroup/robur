name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/k8s/**"
      - "infra/gcp/sql/**"
      - "infra/scripts/wait-for-k8s-job.sh"
      - ".github/workflows/gke-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: robur-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and push containers
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      REGISTRY: ${{ vars.GCP_REGION || 'europe-west2' }}-docker.pkg.dev
      REPOSITORY: robur-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push web
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/robur-web
        run: |
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" -f apps/web/Dockerfile .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Build and push API
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/robur-api
        run: |
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" -f apps/api/Dockerfile .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy manifests
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      CLUSTER: ${{ vars.GKE_CLUSTER || 'robur-cluster' }}
      K8S_NAMESPACE: robur
      WEB_DOMAIN_NAME: ${{ vars.WEB_DOMAIN_NAME || 'app.robur.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials "${CLUSTER}" --region "${REGION}" --project "${PROJECT_ID}"

      - name: Apply namespace and configuration
        run: |
          kubectl apply -f infra/k8s/namespace.yaml
          sed "s/PROJECT_ID/${PROJECT_ID}/g" infra/k8s/config/serviceaccounts.yaml | kubectl apply -f -
          kubectl -n "${K8S_NAMESPACE}" apply -f infra/k8s/config/robur-config.yaml

      - name: Apply SQL migrations config
        run: |
          kubectl -n "${K8S_NAMESPACE}" create configmap robur-sql-migrations \
            --from-file=infra/gcp/sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run migrations
        run: |
          kubectl -n "${K8S_NAMESPACE}" delete job robur-flyway --ignore-not-found
          kubectl -n "${K8S_NAMESPACE}" apply -f infra/k8s/migrations/flyway-job.yaml
          ./infra/scripts/wait-for-k8s-job.sh "${K8S_NAMESPACE}" robur-flyway

      - name: Apply app workloads
        run: |
          for file in infra/k8s/api-deployment.yaml infra/k8s/web-deployment.yaml; do
            sed "s/PROJECT_ID/${PROJECT_ID}/g; s/app.robur.app/${WEB_DOMAIN_NAME}/g" "$file" | kubectl apply -f -
          done
          kubectl apply -f infra/k8s/api-service.yaml
          kubectl apply -f infra/k8s/web-service.yaml
          sed "s/app.robur.app/${WEB_DOMAIN_NAME}/g" infra/k8s/managed-certificate.yaml | kubectl apply -f -
          sed "s/app.robur.app/${WEB_DOMAIN_NAME}/g" infra/k8s/ingress.yaml | kubectl apply -f -

      - name: Restart deployments onto new images
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout restart deployment/robur-api deployment/robur-web
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/robur-api --timeout=300s
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/robur-web --timeout=300s
