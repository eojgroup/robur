name: Validate prepared cloud configuration

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "apps/web/**", "packages/**", "infra/gcp/cloud-run/**", "infra/gcp/sql/**", "infra/cloudbuild-health.yaml", ".github/workflows/cloud-run-deploy.yml", "pnpm-lock.yaml", "package.json"]
  pull_request:
    paths: ["apps/api/**", "apps/web/**", "packages/**", "infra/gcp/cloud-run/**", "infra/gcp/sql/**", "infra/cloudbuild-health.yaml", ".github/workflows/cloud-run-deploy.yml", "pnpm-lock.yaml", "package.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robur-health-cloud-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.5
      - name: Validate cost-bounded infrastructure
        working-directory: infra/gcp/cloud-run
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
