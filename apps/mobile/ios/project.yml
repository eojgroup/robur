name: Robur
options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: com.eojgroup
settings:
  base:
    MARKETING_VERSION: ${MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  Robur:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/RoburApp
      - path: Sources/RoburShared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eojgroup.robur
        PRODUCT_NAME: Robur
        INFOPLIST_FILE: Sources/RoburApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/RoburApp/Robur.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
      - sdk: EventKit.framework
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: Charts.framework
      - sdk: UserNotifications.framework
      - target: Robur Widgets
        embed: true
      - target: RoburWatch Watch App
        embed: true
  RoburWatch Watch App:
    # A single-target SwiftUI watchOS app. `application.watchapp2` is for the
    # legacy app/extension layout and produces duplicate executable tasks.
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/RoburWatchApp
      - path: Sources/RoburShared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eojgroup.robur.watchkitapp
        PRODUCT_NAME: Robur Watch
        INFOPLIST_FILE: Sources/RoburWatchApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/RoburWatchApp/RoburWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: HealthKit.framework
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - target: Robur Watch Widgets
        embed: true
  Robur Widgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/RoburWidgets
      - path: Sources/RoburShared/WorkoutHistory.swift
      - path: Sources/RoburShared/WorkoutQuickReview.swift
      - path: Sources/RoburShared/TrainingBalance.swift
      - path: Sources/RoburShared/TrainingInsights.swift
      - path: Sources/RoburShared/RecoveryInsights.swift
      - path: Sources/RoburShared/HealthInsights.swift
      - path: Sources/RoburShared/WidgetHealthSummary.swift
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eojgroup.robur.widgets
        PRODUCT_NAME: Robur Widgets
        INFOPLIST_FILE: Sources/RoburWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/RoburWidgets/RoburWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: HealthKit.framework
  Robur Watch Widgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/RoburWidgets
        excludes: [Info.plist, RoburWidgets.entitlements]
      - path: Sources/RoburWatchWidgets
      - path: Sources/RoburShared/WorkoutHistory.swift
      - path: Sources/RoburShared/WorkoutQuickReview.swift
      - path: Sources/RoburShared/TrainingBalance.swift
      - path: Sources/RoburShared/TrainingInsights.swift
      - path: Sources/RoburShared/RecoveryInsights.swift
      - path: Sources/RoburShared/HealthInsights.swift
      - path: Sources/RoburShared/WidgetHealthSummary.swift
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eojgroup.robur.watchkitapp.widgets
        PRODUCT_NAME: Robur Watch Widgets
        INFOPLIST_FILE: Sources/RoburWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/RoburWatchWidgets/RoburWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: HealthKit.framework
  RoburTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/RoburTests
    dependencies:
      - target: Robur
schemes:
  Robur:
    build:
      targets:
        Robur: all
        RoburWatch Watch App: all
        Robur Widgets: all
        Robur Watch Widgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoburTests
    archive:
      config: Release
